# =====================================================================
# 我的博客 - 站点配置（FixIt 主题 · 全功能版）
# 地址：https://ljhysz00000-star.github.io/
#
# 说明：本文件只写「需要覆盖主题默认值」的项。
#       FixIt 主题自带 1655 行完整默认配置（含 40+ 参数分组），
#       Hugo 会自动合并，所以这里不必重复抄一遍。
# =====================================================================

baseURL = 'https://ljhysz00000-star.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '我的博客'
theme = 'FixIt'

# --- 中文内容优化 ---
hasCJKLanguage = true      # 中文按字计数（字数/阅读时长/摘要才准）
summaryLength = 120        # 摘要截断长度
enableEmoji = true         # 支持 :smile: 表情语法
enableRobotsTXT = true     # 生成 robots.txt
enableGitInfo = false      # 关闭 Git 时间（CI 浅克隆下回显错时间）

# --- FixIt 必需：继承主题的 markup / outputs / taxonomies ---
[markup]
  _merge = "shallow"

[outputs]
  _merge = "shallow"

[taxonomies]
  _merge = "shallow"

# =====================================================================
# 顶部菜单
# =====================================================================
[[menus.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 1
params = { icon = "fa-solid fa-pen-nib" }

[[menus.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 2
params = { icon = "fa-solid fa-box-archive" }

[[menus.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 3
params = { icon = "fa-solid fa-folder-tree" }

[[menus.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 4
params = { icon = "fa-solid fa-tags" }

[[menus.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 5
params = { icon = "fa-solid fa-circle-info" }

# =====================================================================
# 站点参数
# =====================================================================
[params]
version = "0.4.5"
description = "记录、整理、分享"
keywords = []
defaultTheme = "auto"        # 自动跟随系统明暗
enablePWA = true             # 可安装为桌面/手机应用
externalIcon = true          # 外链自动加小箭头图标
withSiteTitle = true
indexWithSubtitle = true     # 首页标题带上副标题
summaryPlainify = false
tooltip = true
disableThemeInject = false

# --- 应用 / PWA 图标（图标文件在 static/ 目录）---
[params.app]
title = "我的博客"
noFavicon = false
iconColor = ""
tileColor = "#19c9e5"

# --- 作者 ---
[params.author]
name = "培烁"
link = "https://github.com/ljhysz00000-star"
email = ""
avatar = ""

# --- 源码仓库信息（文章底部的「查看源码/编辑此页」按钮指向这里）---
[params.gitInfo]
repo = "https://github.com/ljhysz00000-star/ljhysz00000-star.github.io"
branch = "main"
dir = "content"

# =====================================================================
# 搜索（本地全文搜索，无需任何账号）
# =====================================================================
[params.search]
enable = true
type = "fuse"
contentLength = 4000
maxResultLength = 10
snippetLength = 30
absoluteURL = false
anchorify = true

# =====================================================================
# 页头
# =====================================================================
[params.header]
desktopMode = "sticky"
mobileMode = "auto"

[params.header.title]
name = "我的博客"
typeit = false

[params.header.subtitle]
name = "记录、整理、分享"
typeit = false

# --- 面包屑导航 ---
[params.breadcrumb]
enable = true
sticky = true                # 滚动时吸顶
showHome = true
separator = "/"

# --- 上一篇 / 下一篇导航 ---
[params.navigation]
inSection = true

# =====================================================================
# 页脚
# =====================================================================
[params.footer]
enable = true
copyright = true
author = true
since = "2026"

[params.footer.siteTime]
enable = true                # 显示网站运行时间
animate = true
value = "2026-09-12T00:00:00+08:00"

# =====================================================================
# 标签云（/tags/ 页面）
# =====================================================================
[params.tagcloud]
enable = true
min = 14
max = 32
peakCount = 10
orderby = "count"

# =====================================================================
# 首页
# =====================================================================
[params.home.profile]
enable = true                # 首页显示个人名片
avatarURL = "https://github.com/ljhysz00000-star.png"
title = "培烁"
subtitle = "记录、整理、分享"
typeit = false
social = true
disclaimer = ""

[params.home.posts]
enable = true
paginate = 6

# --- 社交链接 ---
[params.social]
GitHub = "ljhysz00000-star"
RSS = true

# =====================================================================
# 中文排版：中英文之间自动加空格
# =====================================================================
[params.pangu]
enable = true
selector = "article"

# =====================================================================
# 访问量统计（不蒜子 / vercount，免费、无需注册）
# =====================================================================
[params.busuanzi]
enable = true
siteViews = true
pageViews = true

# =====================================================================
# Cookie 提示条
# =====================================================================
[params.cookieconsent]
enable = true

[params.cookieconsent.content]
message = "本站使用 Cookie 记录阅读偏好，继续浏览表示你同意。"
dismiss = "知道了"
link = ""

# =====================================================================
# 右上角 GitHub 角标
# =====================================================================
[params.githubCorner]
enable = true
permalink = "https://github.com/ljhysz00000-star/ljhysz00000-star.github.io"
title = "在 GitHub 上查看源码"
position = "right"

# =====================================================================
# 阅读体验
# =====================================================================
[params.backToTop]
enable = true
scrollpercent = true         # 回到顶部按钮显示百分比圆环

[params.readingProgress]
enable = true                # 顶部阅读进度条
position = "top"
reversed = true

[params.pace]
enable = true                # 页面加载时的顶部进度条
color = "blue"
theme = "minimal"

# --- 代码块：复制 / 下载 / 全屏 / 行号开关 / 换行开关 / 编辑 ---
[params.codeblock]
wrapper = true
mode = "classic"
maxShownLines = 10
shadow = "never"
copyable = true
downloadable = true
fullscreen = true
lineNosToggler = true
lineWrapToggler = true
editable = true

# --- 老浏览器兼容 ---
[params.compatibility]
polyfill = false             # 引入第三方脚本，现代浏览器无必要，故不开
objectFit = false

# --- 图片优化（有图片后自动生成缩略图/WebP，构建会变慢，按需开）---
[params.image]
cacheRemote = false
optimise = false

# --- 水印（会盖在正文上，默认不开）---
[params.watermark]
enable = false

# --- AI 相关（需要 PostChat 的 API Key，暂不开）---
[params.postChat]
enable = false

[params.postSummary]
enable = false

[params.podcast]
enable = false

# --- 开发者选项 ---
[params.dev]
enable = false

# =====================================================================
# 页面级配置
# =====================================================================
[params.page]
authorAvatar = true
twemoji = false              # 表情改用 Twitter 图源，需外部 CDN，不开
lightgallery = "force"       # 图片灯箱：正文图片全部支持点击放大（照片墙核心功能）
autoBookmark = true          # 自动记住阅读位置
instantPage = true           # 预加载，点链接秒开
collectionList = true        # 侧边显示同合集目录
collectionNavigation = true  # 文末显示同合集上下篇
showLastmod = true           # 显示最后修改时间
wordCount = true             # 显示字数
readingTime = true           # 显示阅读时长
linkToMarkdown = true        # 显示「查看 Markdown 原文」
linkToSource = true          # 显示「查看源码」
linkToEdit = true            # 显示「编辑此页」（跳 GitHub 网页编辑）
linkToReport = false
linkToVscode = false

# --- 相关文章推荐 ---
[params.page.related]
enable = true
count = 5
position = ["aside", "footer"]

# --- 文章目录 ---
[params.page.toc]
enable = true
keepStatic = false
auto = true
position = "right"
ordered = true               # 目录带编号
startLevel = 2
endLevel = 6

# --- 标题自动编号（配合上面的目录编号）---
[params.page.heading.number]
enable = true
onlyMainSection = true

# --- 文章过期提醒 ---
[params.page.expirationReminder]
enable = true
reminder = 90
warning = 180
closeComment = false

# --- 分享按钮 ---
[params.page.share]
enable = true
Twitter = true
Facebook = true
Weibo = true

# --- 评论：需要外部服务授权，配置好后再打开（见 README 说明）---
[params.page.comment]
enable = false
