name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 自动识别 hugo.toml 里的 theme，下载对应主题
      - name: Detect theme
        id: theme
        run: |
          THEME=$(grep -E "^theme *=" hugo.toml | head -1 | sed -E "s/.*[\"']([^\"']+)[\"'].*/\1/")
          echo "name=$THEME" >> "$GITHUB_OUTPUT"
          echo "当前主题：$THEME"

      - name: Download theme
        run: |
          set -euo pipefail
          THEME="${{ steps.theme.outputs.name }}"
          case "$THEME" in
            FixIt)            URL="https://github.com/hugo-fixit/FixIt/archive/refs/tags/v0.4.5.tar.gz" ;;
            PaperMod)         URL="https://github.com/adityatelange/hugo-PaperMod/archive/refs/tags/v8.0.tar.gz" ;;
            hugo-theme-stack) URL="https://github.com/CaiJimmy/hugo-theme-stack/archive/refs/tags/v4.0.3.tar.gz" ;;
            *) echo "未知主题：$THEME（请检查 hugo.toml 的 theme 字段）"; exit 1 ;;
          esac
          TMP="$(mktemp -d)"
          curl -sSL "$URL" | tar xz -C "$TMP"
          SRC="$(find "$TMP" -maxdepth 1 -mindepth 1 -type d | head -1)"
          mkdir -p themes
          rm -rf "themes/$THEME"
          mv "$SRC" "themes/$THEME"
          echo "主题已就位：themes/$THEME"

      # PaperMod 在新版 Hugo 上需要删掉已移除的 site.Social 兜底分支
      - name: Patch PaperMod
        if: steps.theme.outputs.name == 'PaperMod'
        run: node _theme-scripts/patch-papermod.cjs themes/PaperMod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
